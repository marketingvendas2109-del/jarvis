<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#050a1a"><title>Jarvis</title><style>:root{--bg:#050a1a;--acc:#4f7cff;--acc2:#8b5cf6;--txt:#e8eeff;--dim:#8a97bd;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);--line:rgba(140,170,255,.18);--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:"SF Mono",Monaco,"Cascadia Code",Menlo,Courier,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans)}
body{background:radial-gradient(ellipse 80% 50% at 50% -5%,#1b2f78 0%,transparent 70%),radial-gradient(ellipse 70% 40% at 90% 100%,#2a1a6a 0%,transparent 70%),var(--bg);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none}
input,select,textarea{font-family:inherit;color:var(--txt)}
.hidden{display:none!important}
svg.i{width:22px;height:22px;display:block}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .7s}

#splash .nm{font-family:var(--mono);font-weight:700;font-size:clamp(34px,10vw,64px);letter-spacing:.35em;padding-left:.35em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .ln{width:min(320px,60vw);height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent)}
#splash .sy{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--acc);animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.2}}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(5,10,26,.55)}}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.hdr .ttl{font-size:19px;font-weight:600;letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--dim);min-width:84px;justify-content:center}
.chip i{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}
.ic{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px)}
.ic:active{background:var(--glass2)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px}
#hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
#heroOrb{width:min(62vw,230px);aspect-ratio:1;display:block}
#hero h1{font-size:26px;font-weight:600;margin-top:2px}
#hero p{color:var(--dim);margin-top:6px;font-size:15px}
.modeChip{margin-top:12px;font-size:12px;color:var(--acc);border:1px solid var(--line);background:var(--glass);padding:6px 12px;border-radius:999px}
#quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.qc{display:flex;align-items:center;gap:10px;text-align:left;padding:13px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:14px;line-height:1.5}
.qc:active{background:var(--glass2)}
.qc .em{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(79,124,255,.16);display:grid;place-items:center;font-size:17px}
#msgs{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.m{display:flex;gap:10px;max-width:100%}.m.u{justify-content:flex-end}
.m .bub{max-width:86%;line-height:1.5;font-size:15.5px;overflow-wrap:anywhere}
.m.u .bub{background:linear-gradient(135deg,var(--acc),var(--acc2));padding:10px 14px;border-radius:18px 18px 4px 18px;box-shadow:0 6px 24px rgba(79,124,255,.25)}
.m.a .av{width:28px;height:28px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9db8ff 40%,#4f7cff 80%);box-shadow:0 0 14px rgba(79,124,255,.6);margin-top:2px}
.m.a .bub{padding:2px 0}.m.a.err .bub{color:#ffb4a8}
.bub ul{margin:6px 0 6px 20px}
.bub code{font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px}
.bub pre{font-family:var(--mono);font-size:13px;background:rgba(0,0,0,.4);border:1px solid var(--line);padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:dt 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
#composer{padding:8px 14px 10px}
.pill{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;border-radius:26px;background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(14px)}
#txt{flex:1;min-width:0;background:none;border:0;resize:none;font-size:16px;line-height:1.4;max-height:120px;padding:9px 0;outline:none}
#txt::placeholder{color:var(--dim)}
.rb{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center}
#sendBtn{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(79,124,255,.5)}
#voiceBtn{background:rgba(79,124,255,.22);border:1px solid var(--line);color:#bcd0ff}
.tabs{display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(8,14,34,.8);backdrop-filter:blur(12px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:4px 0}
.tab .e{font-size:20px;filter:grayscale(1) brightness(1.2);opacity:.75}
.tab.on{color:#fff}.tab.on .e{filter:none;opacity:1}
#plus{width:58px;height:58px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 0 26px rgba(79,124,255,.5)}
.sec{font-size:13px;color:var(--dim);margin:18px 2px 8px;letter-spacing:.04em}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%}
.row .em{width:38px;height:38px;flex:none;border-radius:11px;background:rgba(79,124,255,.16);display:grid;place-items:center;font-size:18px}
.row b{display:block;font-size:15px;font-weight:600}
.row small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.35}
.row.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 0 18px rgba(79,124,255,.25)}
.pg{font-size:22px;font-weight:600;margin:6px 2px 4px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:12.5px;color:var(--dim)}
.f input,.f select{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px;width:100%}
.ok{color:#10b981}
.btn{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);font-size:14px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600}
.btn.del{color:#ff7a6b;border-color:#ff7a6b55}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;margin-bottom:12px}
.sw input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.15);border-radius:999px;position:relative;transition:.2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{left:21px}
.bhero{display:flex;justify-content:space-between;align-items:center;gap:10px}
#bCount{font-family:var(--mono);font-size:12px;color:var(--acc)}
#graph{margin-top:8px;border:1px solid var(--line);border-radius:18px;background:rgba(6,10,24,.7);overflow:hidden}
#graph svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin:10px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.node{cursor:pointer}
.node text{font-family:var(--sans);font-size:15px;fill:#e8eeff;text-anchor:middle;pointer-events:none}
.nring{fill:none;stroke-width:1.5;animation:br 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.coreC{animation:br 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes br{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(1.18)}}
.edge{fill:none;stroke-width:1.1;stroke-dasharray:5 11;animation:sl 2.4s linear infinite;opacity:.55}
@keyframes sl{to{stroke-dashoffset:-32}}
.node.flash .ncircle{animation:fl .45s ease-in-out 4}
@keyframes fl{50%{opacity:.15}}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#editor{position:fixed;inset:0;z-index:90;background:rgba(2,4,12,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.ed{width:min(460px,100%);background:#0b1330;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ed h3{font-size:16px}.ed label{font-size:12.5px;color:var(--dim)}
.ed input,.ed select,.ed textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}
.ed textarea{min-height:120px;resize:vertical}
.ed .rw{display:flex;gap:8px;justify-content:flex-end}.ed .rw .del{margin-right:auto}
.cbar{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}.cbar::-webkit-scrollbar{display:none}.cb{flex:none;max-width:170px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.nring,.coreC,.edge,.dots span,#splash .sy{animation:none}}</style></head><body>
<div id="splash"><div class="nm">JARVIS</div><div class="ln"></div><div class="sy">SINCRONIZANDO DADOS...</div></div>
<div id="app">
<header class="hdr"><button class="ic" id="hMenu" type="button" aria-label="Histórico"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button><div class="ttl">Jarvis</div><button class="ic chip" id="provChip" type="button"><span>Gemini</span></button></header>
<main id="main">
<section id="vChat" class="view"><div id="hero"><canvas id="heroOrb"></canvas><h1 id="greet"></h1><p>Como posso ajudar você hoje?</p><button class="modeChip" id="modeChip" type="button"></button></div><div id="quick"></div><div id="msgs"></div></section>
<section id="vSettings" class="view hidden"><div class="pg">⚙️ Ajustes</div><div class="sec">FISH AUDIO (Voz IA)</div><div class="gl"><div class="li col"><label for="fishKey"><b>🔑 Chave API Fish Audio</b><small>De https://fish.audio</small></label><input id="fishKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk_..."></div><div class="li col"><label for="fishVoice"><b>🎤 ID da Voz</b><small>ID único da voz no Fish</small></label><input id="fishVoice" type="text" autocomplete="off" spellcheck="false" placeholder="voice-id-aqui"></div><div class="li"><span><b>✅ Testar Voz</b><small id="fishStatus">Clique para testar o áudio</small></span><button class="go" id="fishTest" type="button">▶ Testar</button></div></div><div class="sec">GEMINI (IA)</div><div class="gl"><div class="li col"><label for="gemKey"><b>🔑 Chave API Gemini</b><small>De https://aistudio.google.com</small></label><input id="gemKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza..."></div></div></section>
</main>
<div id="composer"><div class="pill"><input id="txt" type="text" placeholder="Pergunte qualquer coisa..." autocomplete="off"><button class="rb hidden" id="sendBtn" type="button" aria-label="Enviar">➤</button><button class="rb" id="voiceBtn" type="button" aria-label="Voz">🎤</button></div></div>
<nav class="tabs"><button class="tab on" data-v="vChat" type="button"><span class="e">💬</span><span>Chat</span></button><button class="tab" data-v="vSettings" type="button"><span class="e">⚙️</span><span>Ajustes</span></button></nav>
</div>
<script>
const CONFIG={name:"Jarvis",userName:"Wagner",persona:"assistente profissional, educado e preciso"};
const EA=new Audio();
let chatLog=[],sending=false,lastReply="";

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// ========== FUNÇÃO PRINCIPAL: FISH AUDIO ==========
async function fishAudio(texto, apiKey, voiceId) {
  if (!apiKey || !voiceId) {
    throw new Error("Configure a chave e ID da voz do Fish Audio");
  }

  const models = ["", "s1"];
  let lastError = null;

  for (const model of models) {
    try {
      const headers = {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      };
      
      if (model) headers.model = model;

      const response = await fetch("https://api.fish.audio/v1/tts", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          text: texto,
          reference_id: voiceId,
          format: "mp3"
        })
      });

      if (!response.ok) {
        const error = await response.text();
        lastError = new Error(`Fish HTTP ${response.status}: ${error.slice(0, 100)}`);
        console.warn(`Modelo ${model || 'padrão'} falhou:`, lastError.message);
        continue;
      }

      const blob = await response.blob();
      if (blob.size === 0) {
        lastError = new Error("Áudio vazio retornado");
        continue;
      }

      console.log(`✓ Fish Audio respondeu (modelo: ${model || 'padrão'})`);
      return blob;

    } catch (error) {
      lastError = error;
      console.error(`Erro no modelo ${model || 'padrão'}:`, error);
    }
  }

  throw lastError || new Error("Falha ao gerar áudio com Fish Audio");
}

// ========== FALAR COM FISH AUDIO ==========
async function speak(texto) {
  const apiKey = lsGet("fish_key", "").trim();
  const voiceId = lsGet("fish_voice", "").trim();

  if (!texto || !texto.trim()) return;

  try {
    $("fishStatus").textContent = "🔄 Gerando áudio...";
    $("fishStatus").style.color = "#fff";

    const blob = await fishAudio(texto, apiKey, voiceId);
    const url = URL.createObjectURL(blob);

    EA.src = url;
    EA.play();

    $("fishStatus").textContent = "✓ Reproduzindo áudio";
    $("fishStatus").style.color = "#10b981";

    EA.onended = () => URL.revokeObjectURL(url);
    EA.onerror = (e) => {
      $("fishStatus").textContent = "✗ Erro ao reproduzir";
      $("fishStatus").style.color = "#ef4444";
      console.error("Erro ao reproduzir:", e);
    };

  } catch (error) {
    $("fishStatus").textContent = "✗ " + (error.message || error);
    $("fishStatus").style.color = "#ef4444";
    console.error("Erro:", error);
  }
}

// ========== GEMINI PARA GERAR RESPOSTA ==========
async function callGemini(userMessage) {
  const apiKey = lsGet("gemini_key", "").trim();

  if (!apiKey) {
    throw new Error("Chave Gemini não configurada");
  }

  const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey
      },
      body: JSON.stringify({
        contents: [
          {
            role: "user",
            parts: [{ text: userMessage }]
          }
        ],
        generationConfig: {
          temperature: 0.8,
          maxOutputTokens: 500
        }
      })
    }
  );

  if (!response.ok) {
    throw new Error(`Gemini erro: ${response.status}`);
  }

  const data = await response.json();
  const texto = data.candidates?.[0]?.content?.parts?.[0]?.text;

  if (!texto) {
    throw new Error("Gemini não retornou texto");
  }

  return texto;
}

// ========== UI ==========
function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  $(id).classList.remove("hidden");
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    showView(t.dataset.v);
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  };
});

function pushMsg(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "a");
  d.innerHTML = (role === "user" ? "" : '<div class="av"></div>') + 
                '<div class="bub">' + esc(text) + '</div>';
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

async function sendMessage() {
  const text = $("txt").value.trim();
  if (!text || sending) return;

  sending = true;
  $("txt").value = "";
  pushMsg("user", text);

  try {
    pushMsg("assistant", "⏳ Pensando...");
    const resposta = await callGemini(text);
    lastReply = resposta;

    // Remove mensagem de "pensando"
    const msgs = $("msgs").querySelectorAll(".m.a");
    if (msgs.length > 0) msgs[msgs.length - 1].remove();

    pushMsg("assistant", resposta);

    // Falar a resposta
    if (lsGet("auto_speak", "1") === "1") {
      await speak(resposta);
    }

  } catch (error) {
    pushMsg("assistant", "❌ Erro: " + (error.message || error));
  } finally {
    sending = false;
  }
}

$("txt").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});

$("sendBtn").onclick = sendMessage;
$("txt").addEventListener("input", () => {
  const hasText = $("txt").value.trim().length > 0;
  $("sendBtn").classList.toggle("hidden", !hasText);
});

// ========== FISH AUDIO TEST ==========
$("fishTest").onclick = async () => {
  const apiKey = lsGet("fish_key", "").trim();
  const voiceId = lsGet("fish_voice", "").trim();

  if (!apiKey) {
    $("fishStatus").textContent = "❌ Falta a chave API";
    $("fishStatus").style.color = "#ef4444";
    return;
  }

  if (!voiceId) {
    $("fishStatus").textContent = "❌ Falta o ID da voz";
    $("fishStatus").style.color = "#ef4444";
    return;
  }

  $("fishStatus").textContent = "🔄 Testando...";
  $("fishStatus").style.color = "#fff";

  try {
    await speak("Olá, eu sou Jarvis. Testando a voz aqui.");
    $("fishStatus").textContent = "✓ Sucesso! Voz funcionando";
    $("fishStatus").style.color = "#10b981";
  } catch (error) {
    $("fishStatus").textContent = "✗ " + (error.message || "Erro desconhecido");
    $("fishStatus").style.color = "#ef4444";
  }
};

// ========== GUARDAR CHAVES ==========
$("fishKey").value = lsGet("fish_key", "");
$("fishKey").addEventListener("input", (e) => lsSet("fish_key", e.target.value.trim()));

$("fishVoice").value = lsGet("fish_voice", "");
$("fishVoice").addEventListener("input", (e) => lsSet("fish_voice", e.target.value.trim()));

$("gemKey").value = lsGet("gemini_key", "");
$("gemKey").addEventListener("input", (e) => lsSet("gemini_key", e.target.value.trim()));

// ========== SPLASH ==========
setTimeout(() => {
  $("splash").classList.add("fade");
  setTimeout(() => $("splash").classList.add("hidden"), 750);
}, 1700);

showView("vChat");
</script>
</body>
</html>
