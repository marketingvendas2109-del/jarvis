<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#050a1a"><title>Jarvis</title><style>
:root{--bg:#050a1a;--acc:#4f7cff;--acc2:#8b5cf6;--txt:#e8eeff;--dim:#8a97bd;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);--line:rgba(140,170,255,.18);--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:"SF Mono","Cascadia Mono",Consolas,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans)}
body{background:radial-gradient(ellipse 80% 50% at 50% -5%,#1b2f78 0%,transparent 70%),radial-gradient(ellipse 70% 40% at 90% 100%,#2a1a6a 0%,transparent 70%),var(--bg);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none}
input,select,textarea{font-family:inherit;color:var(--txt)}
.hidden{display:none!important}
svg.i{width:22px;height:22px;display:block}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .7s}
#splash.fade{opacity:0;pointer-events:none}
#splash .nm{font-family:var(--mono);font-weight:700;font-size:clamp(34px,10vw,64px);letter-spacing:.35em;padding-left:.35em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .ln{width:min(320px,60vw);height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent)}
#splash .sy{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--acc);animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.2}}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(5,10,26,.55)}}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.hdr .ttl{font-size:19px;font-weight:600;letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--dim);min-width:84px;justify-content:center}
.chip i{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}
.ic{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(10px)}
.ic:active{background:var(--glass2)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px}
#hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
#heroOrb{width:min(62vw,230px);aspect-ratio:1;display:block}
#hero h1{font-size:26px;font-weight:600;margin-top:2px}
#hero p{color:var(--dim);margin-top:6px;font-size:15px}
.modeChip{margin-top:12px;font-size:12px;color:var(--acc);border:1px solid var(--line);background:var(--glass);padding:6px 12px;border-radius:999px}
#quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.qc{display:flex;align-items:center;gap:10px;text-align:left;padding:13px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:14px;line-height:1.25}
.qc:active{background:var(--glass2)}
.qc .em{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(79,124,255,.16);display:grid;place-items:center;font-size:17px}
#msgs{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.m{display:flex;gap:10px;max-width:100%}.m.u{justify-content:flex-end}
.m .bub{max-width:86%;line-height:1.5;font-size:15.5px;overflow-wrap:anywhere}
.m.u .bub{background:linear-gradient(135deg,var(--acc),var(--acc2));padding:10px 14px;border-radius:18px 18px 4px 18px;box-shadow:0 6px 24px rgba(79,124,255,.25)}
.m.a .av{width:28px;height:28px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9db8ff 40%,#4f7cff 80%);box-shadow:0 0 14px rgba(79,124,255,.6);margin-top:2px}
.m.a .bub{padding:2px 0}.m.a.err .bub{color:#ffb4a8}
.bub ul{margin:6px 0 6px 20px}
.bub code{font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px}
.bub pre{font-family:var(--mono);font-size:13px;background:rgba(0,0,0,.4);border:1px solid var(--line);padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:dt 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
#composer{padding:8px 14px 10px}
.pill{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;border-radius:26px;background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(14px)}
#txt{flex:1;min-width:0;background:none;border:0;resize:none;font-size:16px;line-height:1.4;max-height:120px;padding:9px 0;outline:none}
#txt::placeholder{color:var(--dim)}
.rb{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center}
#sendBtn{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(79,124,255,.5)}
#voiceBtn{background:rgba(79,124,255,.22);border:1px solid var(--line);color:#bcd0ff}
.tabs{display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(8,14,34,.8);backdrop-filter:blur(16px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:4px 0}
.tab .e{font-size:20px;filter:grayscale(1) brightness(1.2);opacity:.75}
.tab.on{color:#fff}.tab.on .e{filter:none;opacity:1}
#plus{width:58px;height:58px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 0 26px rgba(120,100,255,.65);border:2px solid rgba(255,255,255,.15)}
.sec{font-size:13px;color:var(--dim);margin:18px 2px 8px;letter-spacing:.04em}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%}
.row .em{width:38px;height:38px;flex:none;border-radius:11px;background:rgba(79,124,255,.16);display:grid;place-items:center;font-size:18px}
.row b{display:block;font-size:15px;font-weight:600}
.row small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.35}
.row.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 0 18px rgba(79,124,255,.25)}
.pg{font-size:22px;font-weight:600;margin:6px 2px 4px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:12.5px;color:var(--dim)}
.f input,.f select{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px;width:100%}
.ok{color:#10b981}
.btn{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);font-size:14px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600}
.btn.del{color:#ff7a6b;border-color:#ff7a6b55}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;margin-bottom:12px}
.sw input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.15);border-radius:999px;position:relative;transition:.2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{left:21px}
.bhero{display:flex;justify-content:space-between;align-items:center;gap:10px}
#bCount{font-family:var(--mono);font-size:12px;color:var(--acc)}
#graph{margin-top:8px;border:1px solid var(--line);border-radius:18px;background:rgba(6,10,24,.7);overflow:hidden}
#graph svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin:10px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.node{cursor:pointer}
.node text{font-family:var(--sans);font-size:15px;fill:#e8eeff;text-anchor:middle;pointer-events:none}
.nring{fill:none;stroke-width:1.5;animation:br 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.coreC{animation:br 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes br{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(1.18)}}
.edge{fill:none;stroke-width:1.1;stroke-dasharray:5 11;animation:sl 2.4s linear infinite;opacity:.55}
@keyframes sl{to{stroke-dashoffset:-32}}
.node.flash .ncircle{animation:fl .45s ease-in-out 4}
@keyframes fl{50%{opacity:.15}}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#editor{position:fixed;inset:0;z-index:90;background:rgba(2,4,12,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.ed{width:min(460px,100%);background:#0b1330;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ed h3{font-size:16px}.ed label{font-size:12.5px;color:var(--dim)}
.ed input,.ed select,.ed textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}
.ed textarea{min-height:120px;resize:vertical}
.ed .rw{display:flex;gap:8px;justify-content:flex-end}.ed .rw .del{margin-right:auto}
.cbar{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}.cbar::-webkit-scrollbar{display:none}.cb{flex:none;max-width:170px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cb.on{color:#fff;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.cb.d{color:#ff7a6b;border-color:#ff7a6b55}.ic.on{border-color:var(--acc);box-shadow:0 0 12px rgba(79,124,255,.5)}
@media (prefers-reduced-motion:reduce){.nring,.coreC,.edge,.dots span,#splash .sy{animation:none}}

:root{--bg:#0b0615;--acc:#8b5cf6;--acc2:#d946ef;--txt:#f3eeff;--dim:#a79bc9;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(190,150,255,.2)}
body{background:radial-gradient(ellipse 90% 45% at 50% -8%,#5a34c8 0%,transparent 65%),radial-gradient(ellipse 70% 40% at 100% 100%,#8a1f8f 0%,transparent 70%),var(--bg)}
@media(min-width:600px){#app{background:rgba(11,6,21,.55)}}
.hdr .ttl::after{content:"BETA";margin-left:7px;font-size:9px;letter-spacing:.08em;padding:3px 7px;border-radius:999px;background:linear-gradient(135deg,var(--acc),var(--acc2));vertical-align:middle}
.chip,.ic{border-radius:999px;transition:transform .15s,background .2s}.ic:active,.chip:active,.rb:active,.qc:active,.row:active{transform:scale(.94)}
.view:not(.hidden){animation:fi .35s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
#quick{gap:12px}.qc{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:104px;background:transparent;border:1px solid rgba(255,255,255,.26);border-radius:22px;position:relative;transition:transform .15s,border-color .2s}
.qc::after{content:"↗";position:absolute;right:14px;bottom:10px;color:var(--dim);font-size:15px}.qc:hover{border-color:var(--acc2)}.qc .em{background:rgba(217,70,239,.16)}
#hero h1{background:linear-gradient(90deg,#fff,#e9d5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.m{animation:up .35s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(12px) scale(.98)}}
.m.u .bub{background:linear-gradient(135deg,#8b5cf6,#d946ef);border-radius:22px 22px 6px 22px;box-shadow:0 8px 28px rgba(217,70,239,.28)}
.m.a .av{background:radial-gradient(circle at 35% 30%,#fff,#e879f9 40%,#7c3aed 85%);box-shadow:0 0 16px rgba(217,70,239,.6);animation:gl 3s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 26px rgba(217,70,239,.95)}}
.m.a .bub{font-size:16px;line-height:1.62}.dots span{background:var(--acc2)}
.act{display:flex;gap:4px;margin-top:6px}.act button{font-size:14px;padding:4px 9px;border-radius:999px;color:var(--dim);background:var(--glass)}.act button:active{background:var(--glass2)}
.pill{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:30px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#sendBtn{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 20px rgba(217,70,239,.5)}
#voiceBtn{background:linear-gradient(135deg,rgba(139,92,246,.45),rgba(217,70,239,.45));color:#fff;border:1px solid var(--line)}
.tabs{background:rgba(14,8,28,.82)}#plus{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 28px rgba(217,70,239,.6)}
.row .em{background:rgba(217,70,239,.16)}.row.sel{box-shadow:0 0 0 1px var(--acc) inset,0 0 18px rgba(139,92,246,.3)}
.cb.on{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}.ed{background:#150b2a}
#call{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse 85% 55% at 50% 38%,#3b1b86 0%,#0b0615 72%);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));animation:fi .3s both}
.ctop{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}.cttl{font-weight:600;font-size:17px}
#callOrb{width:min(88vw,46vh,420px);aspect-ratio:1;margin:auto 0 0}
#cStatus{font-size:13px;letter-spacing:.2em;color:#e9d5ff;text-transform:uppercase;margin-top:4px;min-height:18px}
.ctxt{width:min(560px,100%);text-align:center;margin:10px 0 auto;max-height:26vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#cYou{color:var(--dim);font-size:14px;font-style:italic;min-height:20px}#cAi{font-size:18px;line-height:1.45}
.cctl{display:flex;gap:22px;align-items:center;margin-top:14px}.cb2{width:58px;height:58px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.cb2.big{width:84px;height:84px;font-size:30px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 0 10px rgba(217,70,239,.14),0 0 34px rgba(217,70,239,.6);animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 18px rgba(217,70,239,.08),0 0 44px rgba(217,70,239,.8)}}
#heroOrb{flex:none;width:min(62vw,230px);height:min(62vw,230px)}
#callOrb{flex:none;height:min(88vw,46vh,420px)}
#call[data-s="thinking"] .cb2.big{animation-duration:.7s}
</style></head><body>
<div id="splash"><div class="nm">JARVIS</div><div class="ln"></div><div class="sy">SINCRONIZANDO DADOS...</div></div>
<div id="app">
<header class="hdr">
<button class="chip" id="provChip" type="button"><i></i><span id="provTxt">Claude</span></button>
<div class="ttl">Jarvis</div>
<div style="display:flex;gap:8px"><button class="ic" id="hBar" type="button" aria-label="Barra de conversas" title="Barra de conversas">🗂️</button><button class="ic" id="hNew" type="button" aria-label="Nova conversa"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>
</header>
<div class="cbar hidden" id="cbar"></div>
<main id="main">
<section id="vChat" class="view"><div id="hero"><canvas id="heroOrb"></canvas><h1 id="greet"></h1><p>Como posso ajudar você hoje?</p><button class="modeChip" id="modeChip" type="button"></button></div><div id="quick"></div><div id="msgs"></div></section>
<section id="vExplore" class="view hidden"><div class="pg">Explorar</div><div class="sec">MODOS DO JARVIS</div><div id="modes"></div><div class="sec">TÓPICOS POPULARES</div><div id="topics"></div></section>
<section id="vMemory" class="view hidden"><div class="bhero"><div class="pg">Second Brain</div><div style="display:flex;gap:8px;align-items:center"><span id="bCount"></span><button class="ic" id="addBtn" type="button" aria-label="Nova nota" style="width:38px;height:38px"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div id="graph"></div><div class="legend" id="legend"></div><div class="sec">SUAS NOTAS</div><div id="notesList"></div><div class="legend" style="color:#10b981">✓ contexto injetado em todas as conversas do Jarvis</div></section>
<section id="vSettings" class="view hidden"><div class="pg">Configurações</div>
<div class="sec">CÉREBRO (IA)</div><div class="card"><div class="f"><label for="provSel">Provedor</label><select id="provSel"><option value="claude">Claude (pelo próprio Claude)</option><option value="gemini">Gemini (Google)</option></select></div><div class="f"><label for="gemKey">Chave do Gemini</label><input id="gemKey" type="password" autocomplete="off" spellcheck="false" placeholder="Cole sua chave aqui"></div><div class="f"><label for="gemModel">Modelo do Gemini</label><input id="gemModel" type="text" autocomplete="off" spellcheck="false"></div><button class="btn" id="testAI" type="button">Testar conexão com a IA</button><div id="testOut" style="font-size:12px;color:var(--dim);margin-top:8px"></div></div>
<div class="sec">VOZ DO JARVIS</div><div id="vlist"></div><div class="card"><label class="sw"><span>Ler as respostas do chat em voz alta</span><input type="checkbox" id="speakReplies"></label><button class="btn" id="testVoice" type="button">Testar voz</button></div>
<div class="sec">DADOS</div><div class="card"><button class="btn" id="clearChat" type="button">Limpar conversa</button></div>
<div class="sec" style="text-align:center">Jarvis v6.0 · tudo é salvo só neste navegador</div></section>
</main>
<div id="composer"><div class="pill"><textarea id="txt" rows="1" placeholder="Mensagem para o Jarvis..."></textarea>
<button class="rb hidden" id="sendBtn" type="button" aria-label="Enviar"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<button class="rb" id="voiceBtn" type="button" aria-label="Ditar por voz"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></button></div></div>
<nav class="tabs"><button class="tab on" data-v="vChat" type="button"><span class="e">💬</span>Chat</button><button class="tab" data-v="vExplore" type="button"><span class="e">🧭</span>Explorar</button><button id="plus" type="button" aria-label="Nova conversa"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="tab" data-v="vMemory" type="button"><span class="e">🧠</span>Memória</button><button class="tab" data-v="vSettings" type="button"><span class="e">⚙️</span>Ajustes</button></nav>
