<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050c">
<title>Jarvis</title>
<style>
/* ============ 1. TOKENS ============ */
:root{
  --bg:#04050c;--txt:#f4f6ff;--dim:#9aa3c7;--acc:#3b82f6;--acc2:#7c3aed;
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(130,160,255,.22);
  --sbg:rgba(14,18,40,.58);--cardbg:rgba(255,255,255,.07);--hl:rgba(255,255,255,.12);
  --ok:#10b981;--bad:#ef4444;--blur:22px;--fs:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","Cascadia Mono",Consolas,Menlo,monospace;color-scheme:dark}
html[data-theme=light]{
  --bg:#fff;--txt:#0a0f1f;--dim:#364065;--glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.9);
  --line:rgba(25,45,140,.3);--sbg:rgba(255,255,255,.78);--cardbg:rgba(255,255,255,.7);--hl:#fff;color-scheme:light}

/* ============ 2. BASE ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans)}
body{overflow:hidden;background:
  radial-gradient(ellipse 90% 45% at 50% -8%,color-mix(in srgb,var(--acc) 40%,#000) 0,transparent 65%),
  radial-gradient(ellipse 70% 40% at 100% 100%,color-mix(in srgb,var(--acc2) 40%,#000) 0,transparent 70%),var(--bg)}
html[data-theme=light] body{background:
  radial-gradient(ellipse 90% 45% at 50% -8%,color-mix(in srgb,var(--acc) 16%,#fff) 0,transparent 65%),
  radial-gradient(ellipse 70% 40% at 100% 100%,color-mix(in srgb,var(--acc2) 16%,#fff) 0,transparent 70%),#fff}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none}
input,select,textarea{font-family:inherit;color:var(--txt)}
.hidden{display:none!important}
svg.i{width:22px;height:22px;display:block}
.hdr,.tabs,.pill,.gl,.card,.row,.qc,.side,.ed,.chip,.ic,.cb2,.btn,.prof,.snav button{
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%)}
.view:not(.hidden){animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}

#app { opacity: 0; transition: opacity .35s ease; }
#app.ready { opacity: 1; }

/* ============ 3. SPLASH ============ */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .7s}
#splash.fade{opacity:0;pointer-events:none}
#splash .nm{font-family:var(--mono);font-weight:700;font-size:clamp(34px,10vw,64px);letter-spacing:.35em;padding-left:.35em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .ln{width:min(320px,60vw);height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent)}
#splash .sy{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--acc);animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.2}}

/* ============ 4. ESTRUTURA ============ */
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(4,5,12,.6)}
  html[data-theme=light] #app{background:rgba(255,255,255,.6)}}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.hdr .ttl{font-size:19px;font-weight:600;letter-spacing:.02em}
.hdr .ttl::after{content:"BETA";margin-left:7px;font-size:9px;letter-spacing:.08em;padding:3px 7px;border-radius:999px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--dim);min-width:84px;justify-content:center}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.ic{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;color:var(--txt);transition:transform .15s,background .2s}
.ic:active,.chip:active,.rb:active,.qc:active,.row:active{transform:scale(.94);background:var(--glass2)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px}

/* ============ 5. TELA INICIAL ============ */
#hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
#heroOrb{flex:none;width:min(62vw,230px);height:min(62vw,230px);display:block}
#hero h1{font-size:26px;font-weight:600;margin-top:2px;background:linear-gradient(90deg,var(--txt),color-mix(in srgb,var(--acc) 45%,var(--txt)));-webkit-background-clip:text;background-clip:text;color:transparent}
#hero p{color:var(--dim);margin-top:6px;font-size:15px}
.modeChip{margin-top:12px;font-size:12px;color:var(--acc);border:1px solid var(--line);background:var(--glass);padding:6px 12px;border-radius:999px}
#quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.qc{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:104px;text-align:left;padding:13px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid var(--line);position:relative;overflow:hidden}
.qc::after{content:"↗";position:absolute;right:14px;bottom:10px;color:var(--dim);font-size:15px}
.qc:hover{border-color:var(--acc2)}
html[data-theme=light] .qc{background:rgba(255,255,255,.72);border-color:rgba(25,45,140,.3);box-shadow:0 1px 0 #fff inset,0 10px 30px rgba(30,60,160,.14)}
.qc .em,.row .em{width:34px;height:34px;flex:none;border-radius:10px;background:color-mix(in srgb,var(--acc) 18%,transparent);display:grid;place-items:center;font-size:17px}

/* ============ 6. MENSAGENS ============ */
#msgs{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.m{display:flex;gap:10px;max-width:100%;animation:up .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px) scale(.98)}}
.m.u{justify-content:flex-end}
.m .bub{max-width:86%;line-height:1.62;font-size:var(--fs);overflow-wrap:anywhere}
.m.u .bub{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:10px 14px;border-radius:22px 22px 6px 22px;box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 30%,transparent)}
.m.a .av{width:28px;height:28px;flex:none;border-radius:50%;margin-top:2px;background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--acc) 60%,#fff) 40%,var(--acc2) 85%)}
.m.a .bub{padding:2px 0}
.m.a.err .bub{color:#ffb4a8}
html[data-theme=light] .m.a.err .bub{color:#c2410c}
.bub ul{margin:6px 0 6px 20px}
.bub code{font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px}
.bub pre{font-family:var(--mono);font-size:13px;background:rgba(0,0,0,.4);border:1px solid var(--line);padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0}
html[data-theme=light] .bub code{background:rgba(30,50,140,.08)}
html[data-theme=light] .bub pre{background:#f1f3fb}
.act{display:flex;gap:4px;margin-top:6px}
.act button{padding:4px 9px;border-radius:999px;color:var(--dim);background:var(--glass)}
.act button:active{background:var(--glass2)}
.act svg.i{width:17px;height:17px}
.attm{display:block;max-width:230px;max-height:230px;border-radius:16px;margin:0 0 8px;object-fit:cover}
.u .attm{margin-left:auto}
.attf{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.2);font-size:13.5px;margin-bottom:6px}
.attf svg.i{width:18px;height:18px}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--acc2);animation:dt 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}

/* ============ 7. CAMPO DE MENSAGEM E ABAS ============ */
#composer{padding:8px 14px 10px}
.pill{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 6px;border-radius:30px;background:var(--glass2);border:1px solid var(--line);box-shadow:0 1px 0 var(--hl) inset,0 8px 30px rgba(0,0,0,.15)}
html[data-theme=light] .pill{background:#fff;box-shadow:0 1px 0 #fff inset,0 8px 28px rgba(30,60,180,.12)}
#txt{flex:1;min-width:0;background:none;border:0;resize:none;font-size:16px;line-height:1.4;max-height:120px;padding:9px 0;outline:none}
#txt::placeholder{color:var(--dim)}
.rb{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
#attBtn{background:var(--glass2);color:var(--txt)}
#attBtn svg.i{width:21px;height:21px}
#sendBtn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent)}
#voiceBtn{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 50%,transparent),color-mix(in srgb,var(--acc2) 50%,transparent));border:1px solid var(--line);color:#fff}
#voiceBtn.live{background:rgba(255,80,60,.55)}
#attPrev{display:flex;padding:0 8px 8px}
.ap{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 7px;border-radius:16px;background:var(--glass2);border:1px solid var(--line);max-width:100%}
.ap img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.ap .fi{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;flex:none}
.ap .fi svg.i{width:22px;height:22px}
.ap .n{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.ap button{width:28px;height:28px;border-radius:50%;background:var(--glass);flex:none;display:grid;place-items:center}
.ap button svg.i{width:16px;height:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(6,8,18,.85)}
html[data-theme=light] .tabs{background:rgba(255,255,255,.82)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:4px 0}
.tab .e{opacity:.72}.tab .e svg.i{width:25px;height:25px}
.tab.on{color:var(--txt)}.tab.on .e{opacity:1;color:var(--acc)}
#plus{width:58px;height:58px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;transform:translateY(-14px);box-shadow:0 0 24px color-mix(in srgb,var(--acc) 30%,transparent)}

/* ============ 8. EXPLORAR, LISTAS E BOTÕES ============ */
.pg{font-size:22px;font-weight:600;margin:6px 2px 4px}
.sec{font-size:13px;color:var(--dim);margin:18px 2px 8px;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
html[data-theme=light] .row{box-shadow:0 1px 0 #fff inset,0 10px 30px rgba(30,60,160,.14)}
.row .em{width:38px;height:38px;border-radius:11px;font-size:18px}
.row b{display:block;font-size:15px;font-weight:600}
.row small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.35}
.row.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 0 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.btn{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);font-size:14px;color:var(--txt)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600;color:#fff}
.btn.del{color:#ff7a6b;border-color:#ff7a6b55}
.ok{color:var(--ok)}

/* ============ 9. SECOND BRAIN ============ */
.bhero{display:flex;justify-content:space-between;align-items:center;gap:10px}
#bCount{font-family:var(--mono);font-size:12px;color:var(--acc)}
#graph{margin-top:8px;border:1px solid var(--line);border-radius:18px;background:rgba(6,10,24,.7);overflow:hidden}
html[data-theme=light] #graph{background:rgba(240,243,255,.85)}
#graph svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin:10px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.node{cursor:pointer}
.node text{font-family:var(--sans);font-size:15px;fill:var(--txt);text-anchor:middle;pointer-events:none}
.nring{fill:none;stroke-width:1.5;animation:br 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.coreC{animation:br 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes br{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(1.18)}}
.edge{fill:none;stroke-width:1.1;stroke-dasharray:5 11;animation:sl 2.4s linear infinite;opacity:.55}
@keyframes sl{to{stroke-dashoffset:-32}}
.node.flash .ncircle{animation:fl .45s ease-in-out 4}
@keyframes fl{50%{opacity:.15}}
#editor{position:fixed;inset:0;z-index:90;background:rgba(2,4,12,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.ed{width:min(460px,100%);background:#0b0e1c;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
html[data-theme=light] .ed{background:#fff}
.ed h3{font-size:16px}.ed label{font-size:12.5px;color:var(--dim)}
.ed input,.ed select,.ed textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}
html[data-theme=light] .ed input,html[data-theme=light] .ed select,html[data-theme=light] .ed textarea{background:#f3f5fd}
.ed textarea{min-height:120px;resize:vertical}
.ed .rw{display:flex;gap:8px;justify-content:flex-end}.ed .rw .del{margin-right:auto}

/* ============ 10. MENU LATERAL ============ */
.side{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);z-index:60;transform:translateX(-104%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:10px;padding:18px 14px 14px;border-right:1px solid var(--line);background:rgba(8,12,17,.92);box-shadow:20px 0 48px rgba(0,0,0,.28)}
.side.open{transform:none}
#scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,10,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
.sh{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:700;letter-spacing:.02em}
.snew{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;font-size:15px}
#sSearch{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:15px;color:var(--txt);outline:none}
#sList{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.sg{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 8px 6px}
.si{display:flex;align-items:center;gap:6px;padding:11px 12px;border-radius:13px;font-size:15px;cursor:pointer}
.si:active,.si:hover{background:var(--glass2)}
.si.on{background:var(--glass2);box-shadow:0 0 0 1px var(--line) inset}
.si .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .sd{width:30px;height:30px;border-radius:9px;color:var(--dim);display:grid;place-items:center;flex:none}
.si .sd svg.i{width:17px;height:17px}
.si .sd.arm{background:var(--bad);color:#fff;width:auto;padding:0 9px;font-size:12px}
.sset{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:15px}

/* ============ 11. AJUSTES ============ */
.prof{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;border:1px solid var(--line);background:var(--cardbg);margin-top:6px}
.pav{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;box-shadow:0 0 24px rgba(59,130,246,.25)}
.pst{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:12.5px;color:var(--dim)}
.snav{display:flex;gap:8px;overflow-x:auto;margin:14px -4px 2px;padding:2px 4px 6px;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav button{flex:none;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--dim)}
.snav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.cat{animation:fi .3s both}
.grp{margin-top:20px}
.gt{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:0 8px 8px}
.gl{border:1px solid var(--line);border-radius:22px;background:var(--cardbg);overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.2)}
html[data-theme=light] .gl{box-shadow:0 1px 0 #fff inset,0 10px 30px rgba(30,60,160,.14)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.gl>.li:first-child{border-top:0}
.li.col{flex-direction:column;align-items:stretch;gap:8px}
.li b{display:block;font-size:15px;font-weight:600}
.li small{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.li .spread{display:flex;justify-content:space-between}
.li input[type=text],.li input[type=password],.li input[type=search]{width:100%;background:rgba(127,127,170,.14);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;color:var(--txt)}
.li textarea{width:100%;min-height:90px;background:rgba(127,127,170,.14);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;color:var(--txt);resize:vertical;outline:none}
.li select{background:rgba(127,127,170,.14);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--txt);font-size:14px;max-width:52%}
.li select.wide{max-width:100%;width:100%}
.li input[type=range]{width:100%;accent-color:var(--acc)}
.li input[type=checkbox]{width:48px;height:29px;appearance:none;-webkit-appearance:none;background:rgba(127,127,170,.38);border-radius:999px;position:relative;transition:.2s;flex:none}
.li input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:.2s}
.li input[type=checkbox]:checked{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.li input[type=checkbox]:checked::after{left:22px}
.li .go{padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;font-size:14px;flex:none}
.li .btnrow{display:flex;gap:8px;flex-wrap:wrap}
.val{font-size:13px;color:var(--dim)}
.dng{color:var(--bad);font-weight:600}
.note{font-size:12px;color:var(--dim);margin:22px 6px 6px;text-align:center}
.seg{display:flex;background:rgba(127,127,170,.16);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--glass2);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.swa{display:flex;gap:14px;padding:4px 2px}
.swa button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.swa button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.gbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600;font-size:14px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gbtn.on{background:#e6f4ea;border-color:#34a853;color:#137333}

/* ============ 12. TELA DE CHAMADA ============ */
#call{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse 85% 55% at 50% 38%,color-mix(in srgb,var(--acc) 35%,#000) 0,var(--bg) 72%)}
html[data-theme=light] #call{background:radial-gradient(ellipse 85% 55% at 50% 38%,color-mix(in srgb,var(--acc) 18%,#fff) 0,#fff 72%)}
.ctop{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
.cttl{font-weight:600;font-size:17px}
#callOrb{flex:none;width:min(88vw,46vh,420px);height:min(88vw,46vh,420px);margin:auto 0 0}
#cStatus{font-size:13px;letter-spacing:.2em;color:color-mix(in srgb,var(--acc) 40%,var(--txt));text-transform:uppercase;margin-top:4px;min-height:18px}
.ctxt{width:min(560px,100%);text-align:center;margin:10px 0 auto;max-height:26vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#cYou{display:none}
#cAi{font-size:18px;line-height:1.45}
.cctl{display:flex;gap:22px;align-items:center;margin-top:14px}
.cb2{width:58px;height:58px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;color:var(--txt)}
.cb2 svg.i{width:24px;height:24px}
.cb2.big{width:84px;height:84px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 15%,transparent),0 0 34px color-mix(in srgb,var(--acc2) 30%,transparent)}
.cb2.big svg.i{width:34px;height:34px}
#call[data-s="thinking"] .cb2.big{animation-duration:.7s}
@keyframes pl{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--acc) 8%,transparent),0 0 44px color-mix(in srgb,var(--acc2) 80%,transparent)}}

#cLevel{width:min(260px,64vw);height:6px;border-radius:999px;background:rgba(127,127,170,.25);overflow:hidden;margin:6px 0 2px}
#cLevel i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .08s linear}
#cLevel.off{visibility:hidden}
#gStat,#b44Stat,#b44MailOut,#nStat{white-space:pre-line;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.srcs{margin-top:10px;font-size:12.5px;color:var(--dim)}
.srcs .sl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.srcs a{padding:4px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);color:var(--txt);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcs iframe.sug{border:0;width:100%;height:46px;margin-top:6px;border-radius:12px;color-scheme:normal}
.vnote{margin-top:8px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vnote button{padding:5px 11px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:12.5px;color:var(--txt)}

#callBg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#call>:where(.ctop,#callClock,#callOrb,#cStatus,#cLevel,.ctxt,#callInfo,#callQuick,.cctl){position:relative;z-index:1}
#callClock{text-align:center;margin-top:2px}
#ckT{font:600 34px var(--mono);letter-spacing:.08em}
#ckD{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
#callInfo{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(560px,94vw);margin-top:6px}
.ipill{font-size:11.5px;padding:5px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.ipill.on{color:var(--txt)}
#callQuick{display:flex;gap:8px;overflow-x:auto;max-width:min(560px,96vw);padding:4px 2px;margin-top:8px;scrollbar-width:none}
#callQuick::-webkit-scrollbar{display:none}
.qchip{flex:none;padding:9px 14px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:13px;color:var(--txt)}
.qchip:active{transform:scale(.95)}
#call.rich #callOrb{width:min(84vw,34vh,380px);height:min(84vw,34vh,380px)}
#call.caps #cYou{display:block}
#call.mini #callBg,#call.mini #callClock,#call.mini #callInfo,#call.mini #callQuick{display:none}
#emoBtns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.chipb{padding:8px 12px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:13px;color:var(--txt)}
.chipb:active{transform:scale(.94)}
.miniX{display:none}
#call.mini{inset:auto 14px calc(92px + env(safe-area-inset-bottom,0px)) auto;width:150px;height:150px;padding:0;border-radius:50%;background:rgba(8,12,28,.88);border:1px solid var(--line);overflow:hidden}
html[data-theme=light] #call.mini{background:rgba(255,255,255,.92)}
#call.mini .ctop,#call.mini .ctxt,#call.mini #cStatus,#call.mini #cLevel,#call.mini .cctl{display:none}
#call.mini #callOrb{width:150px!important;height:150px!important;margin:0!important}
#call.mini .miniX{display:grid;place-items:center;position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--glass2);font-size:16px;line-height:1;z-index:2}

/* ============ 13. PREFERÊNCIAS VISUAIS ============ */
html.no-orb #heroOrb{display:none}
html.no-quick #quick{display:none!important}
html.no-acts .act{display:none}
html.no-motion *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.nring,.coreC,.edge,.dots span,#splash .sy{animation:none}}
</style>
</head>
<body>

<div id="splash"><div class="nm">JARVIS</div><div class="ln"></div><div class="sy">SINCRONIZANDO DADOS...</div></div>

<div id="app">
  <header class="hdr">
    <button class="ic" id="hMenu" type="button" aria-label="Histórico de conversas" data-ico="menu"></button>
    <div class="ttl">Jarvis</div>
    <button class="chip" id="provChip" type="button"><i></i><span>Gemini</span></button>
  </header>

  <main id="main">
    <section id="vChat" class="view">
      <div id="hero">
        <canvas id="heroOrb"></canvas>
        <h1 id="greet"></h1>
        <p>Como posso ajudar você hoje?</p>
        <button class="modeChip" id="modeChip" type="button"></button>
      </div>
      <div id="quick"></div>
      <div id="msgs"></div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab on" data-v="vChat" type="button"><span class="e" data-ico="chat"></span>Chat</button>
    <button class="tab" data-v="vExplore" type="button"><span class="e" data-ico="compass"></span>Explorar</button>
    <button id="plus" type="button" aria-label="Nova conversa" data-ico="plus" data-sw="2.6"></button>
    <button class="tab" data-v="vMemory" type="button"><span class="e" data-ico="brain"></span>Memória</button>
    <button class="tab" data-v="vSettings" type="button"><span class="e" data-ico="sliders"></span>Ajustes</button>
  </nav>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const splash = document.getElementById('splash');
    const app = document.getElementById('app');

    if (app) {
      app.classList.add('ready');
    }

    setTimeout(() => {
      if (splash) {
        splash.classList.add('fade');
      }
    }, 1200);
  });
</script>
</body>
</html>
